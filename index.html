<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--surf:#18233d;--ink:#e8eefc;--mut:#93a3c4;--line:#27365a;--pri:#6aa3ff;--pri2:#1c2f57;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--surf:#18233d;--ink:#e8eefc;--mut:#93a3c4;--line:#27365a;--pri:#6aa3ff;--pri2:#1c2f57;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Nunito,system-ui,sans-serif;background-image:radial-gradient(circle at 90% -10%,#cfe3ff55,transparent 40%),radial-gradient(circle at -10% 30%,#ffe3ec44,transparent 35%)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap;max-width:1000px;margin:auto}
.logo{font-weight:800;font-size:24px;color:var(--pri)}.logo span{color:var(--org)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:transparent;color:var(--mut);font:600 15px Nunito;padding:8px 14px;border-radius:99px;cursor:pointer}
nav button.on{background:var(--pri);color:#fff}
main{max-width:1000px;margin:auto;padding:8px 20px 60px}
h2{font-size:26px;margin:8px 0 14px}h3{margin:0 0 8px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 20px #3b82f614}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{border-radius:18px;padding:16px;color:#fff}.stat b{font-size:34px;display:block;line-height:1.1}
.btn{border:0;border-radius:12px;padding:10px 16px;font:700 15px Nunito;cursor:pointer;background:var(--pri);color:#fff}
.btn.alt{background:var(--pri2);color:var(--pri)}.btn:focus-visible,nav button:focus-visible,.opt:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.mut{color:var(--mut)}.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--pri2);color:var(--pri);margin-right:4px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--vio))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fc{perspective:1000px;max-width:560px;margin:14px auto;cursor:pointer}
.fc .in{min-height:260px;border-radius:24px;padding:26px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;background:linear-gradient(135deg,#e6f0ff,#f3ecff);border:1px solid var(--line);color:#1d2b4a}
.fc.back .in{background:linear-gradient(135deg,#fff6e6,#ffeaf0);text-align:left;align-items:flex-start}
.fc .w{font-size:40px;font-weight:800}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:auto}
.rate button{padding:12px 4px;border:0;border-radius:12px;color:#fff;font:700 14px Nunito;cursor:pointer}
.vid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;width:100%;margin-top:8px}
.vid a{display:block;text-decoration:none;color:#1d2b4a;background:#fff;border-radius:12px;padding:10px;font-size:13px;border:1px solid #e1eaf7}
.vid a b{display:block;font-size:14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font:600 16px Nunito;cursor:pointer}
.opt.ok{border-color:var(--grn);background:#22c08a22}.opt.no{border-color:var(--pnk);background:#ff6b8b22}
input,textarea{width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font:16px Nunito}
.tl{position:relative;padding-left:22px;border-left:3px solid var(--line);margin-left:8px}
.tl div{position:relative;padding:0 0 14px}.tl div:before{content:"";position:absolute;left:-30px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--pri);border:3px solid var(--bg)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.day{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--surf);cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.day.sel{border-color:var(--pri)}.day b{font-size:22px;display:block}
.day.today{background:var(--pri2)}
.wl{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.wrap{overflow-x:auto}
</style>
</head>

return`<div class="card" style="margin-bottom:12px"><h3>Nhập từ từ file</h3><p class="mut" style="margin:0 0 8px">Mỗi dòng là một từ. Các cột cách nhau bằng <b>|</b>, <b>Tab</b> hoặc dấu phẩy (file .csv, .tsv, .txt, mã UTF-8). Thứ tự cột:</p><div class="wrap"><code>word | loại từ | phiên âm | nghĩa tiếng Việt | định nghĩa | ví dụ | chủ đề | câu hỏi speaking | câu mẫu</code></div><p class="mut">Chỉ cột đầu (word) là bắt buộc, ô nào thiếu thì để trống. Hai cột cuối (tùy chọn) là câu hỏi Speaking và câu mẫu của từ; muốn nhiều câu thì ngăn cách bằng ##, câu mẫu theo đúng thứ tự. Dòng tiêu đề, dòng bắt đầu bằng # và từ trùng sẽ được bỏ qua. Với Excel, hãy lưu dưới dạng CSV UTF-8.</p>
<div class="row"><input type="file" accept=".csv,.tsv,.txt,text/plain,text/csv" onchange="readF(this)" style="flex:1;min-width:200px"><button class="btn alt" onclick="ui.txt=SAMPLE;previewImp()">Dùng dữ liệu mẫu</button></div>
<p class="mut" style="margin:10px 0 4px">Hoặc dán nội dung vào đây:</p><textarea rows="6" oninput="ui.txt=this.value" style="font-family:monospace;font-size:14px">${esc(ui.txt||"")}</textarea>
<div class="row" style="margin-top:10px"><input list="tl" placeholder="Chủ đề mặc định nếu dòng không ghi" value="${esc(ui.dt||"")}" oninput="ui.dt=this.value" style="flex:1;min-width:200px"><datalist id="tl">${topics().map(t=>`<option value="${esc(t[0])}">`).join("")}</datalist><select style="${sel}" onchange="ui.dr=this.value">${[[0,"hôm nay"],[1,"ngày mai"],[3,"3 ngày nữa"],[7,"7 ngày nữa"]].map(o=>`<option value="${o[0]}" ${(ui.dr||0)==o[0]?"selected":""}>Ôn lần đầu: ${o[1]}</option>`).join("")}</select><button class="btn" onclick="previewImp()">Xem trước</button></div>
${p?`<div style="margin-top:14px"><p><b>${p.ok.length}</b> từ hợp lệ${p.bad.length?`, <b>${p.bad.length}</b> dòng bị bỏ qua`:""}</p>${p.ok.length?`<div class="wrap"><table style="width:100%;border-collapse:collapse">${p.ok.slice(0,8).map(x=>`<tr style="border-bottom:1px solid var(--line)"><td style="padding:6px"><b>${esc(x.w)}</b></td><td style="padding:6px">${esc(x.vi)}</td><td class="mut" style="padding:6px">${esc(x.t||ui.dt||"Của tôi")}</td></tr>`).join("")}</table></div>${p.ok.length>8?`<p class="mut">…và ${p.ok.length-8} từ nữa</p>`:""}<button class="btn" onclick="doImp()">Nhập ${p.ok.length} từ</button>`:""}${p.bad.length?`<p class="mut">${p.bad.slice(0,5).map(esc).join("<br>")}</p>`:""}</div>`:""}</div>`}
R.sync=function(){const ex=JSON.stringify(S);$("#app").innerHTML=`<h2>Sao lưu & chuyển thiết bị</h2><p class="mut">Tiến độ học lưu trong từng trình duyệt. Để chuyển sang thiết bị khác: sao chép mã ở mục 1, rồi dán vào mục 2 trên thiết bị đó.</p>
<div class="card" style="margin-bottom:12px"><h3>1. Xuất dữ liệu (${all().length} từ, ${Object.keys(S.cards).length} thẻ đã học)</h3><textarea id="ex" rows="4" readonly style="font-family:monospace;font-size:12px" onclick="this.select()">${esc(ex)}</textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="cpy()">Sao chép mã</button><span id="cm" class="mut"></span></div></div>
<div class="card"><h3>2. Khôi phục dữ liệu</h3><textarea id="im" rows="4" placeholder="Dán mã đã sao chép từ thiết bị khác" style="font-family:monospace;font-size:12px"></textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="rs(false)">Gộp vào dữ liệu hiện tại</button><button class="btn alt" onclick="rs(true)">Thay thế toàn bộ</button><span id="rm" class="mut"></span></div><p class="mut" style="margin-bottom:0">Gộp: giữ thẻ có nhiều lượt ôn hơn và thêm từ mới từ mã. Thay thế: xóa dữ liệu hiện tại, dùng dữ liệu từ mã.</p></div>`};
function cpy(){const t=document.getElementById("ex");t.select();let ok=false;try{navigator.clipboard.writeText(t.value);ok=true}catch(e){try{ok=document.execCommand("copy")}catch(e2){}}document.getElementById("cm").textContent=ok?"Đã sao chép!":"Hãy giữ chọn và sao chép thủ công"}
function rs(rep){const m=document.getElementById("rm");let d;try{d=JSON.parse(document.getElementById("im").value)}catch(e){m.textContent="Mã không hợp lệ. Hãy dán đủ toàn bộ mã.";return}
if(!d||typeof d.cards!="object"||!Array.isArray(d.custom||[])){m.textContent="Mã không đúng định dạng của Lexi.";return}
const cu=(d.custom||[]).filter(x=>x&&typeof x.w=="string"&&x.w);
if(rep){S={cards:d.cards,log:d.log||[],custom:cu,best:d.best||0}}else{const have=new Set(S.custom.map(x=>x.w.toLowerCase()));cu.forEach(x=>{if(!have.has(x.w.toLowerCase()))S.custom.push(x)});Object.keys(d.cards).forEach(k=>{const a=S.cards[k],b=d.cards[k];if(!a||(b.n||0)>(a.n||0))S.cards[k]=b});const sn=new Set(S.log.map(l=>l.t+l.w));(d.log||[]).forEach(l=>{if(!sn.has(l.t+l.w))S.log.push(l)});S.log.sort((a,b)=>b.t-a.t);S.log=S.log.slice(0,60);S.best=Math.max(S.best||0,d.best||0)}
save();m.textContent="Đã khôi phục. Hiện có "+Object.keys(S.cards).length+" thẻ."}
const DEF={url:"https://eozpdydbzpjpwzjwxlqv.supabase.co",key:"sb_publishable_iolorwMkFxiH_zEqBT7cLg_NMj3MYta"};var SB=null,SE=null,SYNC;try{SB=JSON.parse(localStorage.getItem("lexi_sb"))}catch(e){}if(!SB||!SB.url||!SB.key)SB=DEF;try{SE=JSON.parse(localStorage.getItem("lexi_ss"))}catch(e){}
const setMsg=t=>{const el=document.getElementById("am");if(el)el.textContent=t};
const sbH=t=>{const h={apikey:SB.key,"Content-Type":"application/json"};if(t)h.Authorization="Bearer "+t;else if(SB.key.startsWith("eyJ"))h.Authorization="Bearer "+SB.key;return h};
async function et(r){try{const j=await r.json();return j.msg||j.error_description||j.message||"Lỗi "+r.status}catch(e){return "Lỗi "+r.status}}
async function sbAuth(kind,body){const r=await fetch(SB.url+"/auth/v1/"+kind,{method:"POST",headers:sbH(),body:JSON.stringify(body)});if(!r.ok)throw new Error(await et(r));return r.json()}
function setSess(j){SE={a:j.access_token,r:j.refresh_token,x:Date.now()+(j.expires_in||3600)*1e3,u:(j.user&&j.user.id)||(SE&&SE.u),m:(j.user&&j.user.email)||(SE&&SE.m)};try{localStorage.setItem("lexi_ss",JSON.stringify(SE))}catch(e){}}
async function tok(){if(!SE)throw new Error("Chưa đăng nhập");if(SE.x-Date.now()<6e4)setSess(await sbAuth("token?grant_type=refresh_token",{refresh_token:SE.r}));return SE.a}
async function pull(){const r=await fetch(SB.url+"/rest/v1/lexi_data?select=data&limit=1",{headers:sbH(await tok())});if(!r.ok)throw new Error(await et(r));const j=await r.json();return j[0]&&j[0].data}
async function pushNow(){const h=sbH(await tok());h.Prefer="resolution=merge-duplicates,return=minimal";const r=await fetch(SB.url+"/rest/v1/lexi_data?on_conflict=user_id",{method:"POST",headers:h,body:JSON.stringify({user_id:SE.u,data:S,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error(await et(r))}
SYNC={tm:0,push(){if(!SE||!SB)return;clearTimeout(this.tm);this.tm=setTimeout(()=>pushNow().then(()=>setMsg("Đã đồng bộ lúc "+new Date().toLocaleTimeString("vi-VN"))).catch(e=>setMsg("Lỗi đồng bộ: "+e.message)),1500)}};
function mergeIn(d){const have=new Set(S.custom.map(x=>x.w.toLowerCase()));(d.custom||[]).forEach(x=>{if(x&&typeof x.w=="string"&&x.w&&!have.has(x.w.toLowerCase()))S.custom.push(x)});Object.keys(d.cards||{}).forEach(k=>{const a=S.cards[k],b=d.cards[k];if(!a||(b.n||0)>(a.n||0))S.cards[k]=b});const sn=new Set(S.log.map(l=>l.t+l.w));(d.log||[]).forEach(l=>{if(!sn.has(l.t+l.w))S.log.push(l)});S.log.sort((a,b)=>b.t-a.t);S.log=S.log.slice(0,60);S.best=Math.max(S.best||0,d.best||0)}
async function syncNow(){setMsg("Đang đồng bộ…");try{const rem=await pull();if(rem)mergeIn(rem);await pushNow();try{localStorage.setItem("lexi2",JSON.stringify(S))}catch(e){}setMsg("Đã đồng bộ lúc "+new Date().toLocaleTimeString("vi-VN")+" · "+Object.keys(S.cards).length+" thẻ")}catch(e){setMsg("Lỗi: "+e.message)}}
function saveCfg(){const u=document.getElementById("su").value.trim().replace(/\/+$/,""),k=document.getElementById("sk").value.trim();if(!/^https:\/\/.+/.test(u)||k.length<20){setMsg("Nhập đúng Project URL (bắt đầu bằng https://) và anon key.");return}SB={url:u,key:k};try{localStorage.setItem("lexi_sb",JSON.stringify(SB))}catch(e){}R.acct()}
function resetCfg(){SB=DEF;SE=null;try{localStorage.removeItem("lexi_sb");localStorage.removeItem("lexi_ss")}catch(e){}R.acct()}
async function doAuth(reg){const e=document.getElementById("ae").value.trim(),p=document.getElementById("ap").value;if(!e||p.length<6){setMsg("Nhập email và mật khẩu từ 6 ký tự.");return}setMsg("Đang xử lý…");try{const j=await sbAuth(reg?"signup":"token?grant_type=password",{email:e,password:p});if(!j.access_token){setMsg("Đã tạo tài khoản. Hãy mở email để xác nhận, rồi quay lại đăng nhập.");return}setSess(j);await syncNow();R.acct()}catch(x){setMsg(x.message)}}
function logout(){SE=null;try{localStorage.removeItem("lexi_ss")}catch(e){}R.acct()}

if(!SB)h+=`<p class="mut">Đăng nhập để dữ liệu học tự động lưu và đồng bộ giữa mọi thiết bị. Dữ liệu nằm trong dự án Supabase miễn phí của riêng bạn.</p><div class="card"><h3>Thiết lập một lần</h3><ol style="padding-left:20px"><li>Tạo dự án miễn phí tại supabase.com.</li><li>Vào <b>SQL Editor</b>, dán đoạn mã dưới đây (bấm vào khung để chọn hết) rồi bấm <b>Run</b>.</li><li>Vào <b>Project Settings → API</b>, sao chép <b>Project URL</b> và <b>anon public key</b> dán vào ô bên dưới.</li><li>Nếu muốn đăng ký xong dùng luôn: <b>Authentication → Sign In / Providers → Email</b>, tắt “Confirm email”.</li></ol><pre class="wrap" style="background:var(--pri2);padding:12px;border-radius:10px;font-size:13px;cursor:pointer" onclick="getSelection().selectAllChildren(this)">${esc(SQL)}</pre><div class="grid"><input id="su" placeholder="Project URL (https://xxxx.supabase.co)"><input id="sk" placeholder="anon public key"></div><p><button class="btn" onclick="saveCfg()">Lưu cấu hình</button> <span id="am" class="mut"></span></p></div>`;
else if(!SE)h+=`<p class="mut">Đăng nhập hoặc tạo tài khoản để đồng bộ tiến độ học lên đám mây.</p><div class="card" style="max-width:460px"><input id="ae" type="email" placeholder="Email" autocomplete="username" style="margin-bottom:10px"><input id="ap" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="current-password" onkeydown="if(event.key=='Enter')doAuth(false)"><div class="row" style="margin-top:12px"><button class="btn" onclick="doAuth(false)">Đăng nhập</button><button class="btn alt" onclick="doAuth(true)">Tạo tài khoản</button></div><p id="am" class="mut"></p><button class="btn alt" style="padding:4px 10px" onclick="resetCfg()">Đổi cấu hình Supabase</button></div>`;
else h+=`<div class="card" style="max-width:520px"><h3>Đang đăng nhập</h3><p><b>${esc(SE.m||"")}</b></p><p class="mut">Mỗi khi bạn học hoặc thêm từ, dữ liệu tự lưu lên đám mây sau vài giây. Trên thiết bị khác, đăng nhập cùng tài khoản rồi bấm Đồng bộ ngay.</p><div class="row"><button class="btn" onclick="syncNow()">Đồng bộ ngay</button><button class="btn alt" onclick="logout()">Đăng xuất</button></div><p id="am" class="mut"></p></div>`;
$("#app").innerHTML=h};

if(ok)ui.s++;
document.querySelectorAll(".opt").forEach(b=>{if(b.textContent==q.a)b.classList.add("ok");else if(b==btn)b.classList.add("no")});
$("#fb").innerHTML=`<p><b>${ok?"Chính xác!":"Đáp án đúng: "+esc(q.a)}</b></p><button class="btn" onclick="ui.n++;ui.done=0;R.quiz()">Câu tiếp</button>`;
